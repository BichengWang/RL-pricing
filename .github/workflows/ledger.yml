name: ledger

# Commits one decision per submission and task before each session opens.
# Weekdays at 04:17, 07:17 and 10:17 UTC leave room for scheduler delays before
# the US open (13:30 UTC in summer, 14:30 UTC in winter). Later runs and holidays
# find the latest session already recorded and do nothing.
# Entries are scored only if their run is a run of this file on main that started
# before the fill session's open (see rl/bench/ledger.py), so never move the
# decision logic out of this workflow.

on:
  schedule:
    - cron: "17 4,7,10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Own group: the freeze job (bench-write) can run for hours after a merge and
    # must not push a decision past the open. Paths are disjoint; pushes rebase.
    concurrency:
      group: ledger
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Cache benchmark data
        uses: actions/cache@v4
        with:
          path: datasets/bench
          key: bench-data-${{ github.run_id }}
          restore-keys: bench-data-
      - name: Install dependencies
        # TradingAgents is pinned in rl/bench/policies/tradingagents.py (not on PyPI;
        # kept out of package metadata so rl-pricing stays publishable).
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
          pip install "$(python -c 'from rl.bench.policies.tradingagents import INSTALL_REQUIREMENT; print(INSTALL_REQUIREMENT)')"
      - name: Record decisions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEDGER_MONTHLY_BUDGET_USD: ${{ vars.LEDGER_MONTHLY_BUDGET_USD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_EDGAR_USER_AGENT: ${{ vars.SEC_EDGAR_USER_AGENT }}
        run: rl-pricing bench ledger record --refresh
      - name: Commit entries
        # Also after a failed record step: entries written before the failure must be committed.
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain --untracked-files=all -- ':(glob)submissions/*/ledger/**')" ]; then
            git add -- ':(glob)submissions/*/ledger/**'
          fi
          if git diff --cached --quiet; then
            echo "No new entries"
          else
            git commit -m "ledger: record decisions [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
