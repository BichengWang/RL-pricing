name: bench

on:
  pull_request:
    paths:
      - "submissions/**"
      - "rl/bench/**"
      - ".github/workflows/bench.yml"
  push:
    branches: [main]
    paths:
      - "submissions/**"
  # Auto Merge lands pull requests with GITHUB_TOKEN, whose pushes start no
  # workflows, so its completion stands in for `push` (see the `merged` job).
  workflow_run:
    workflows: [Auto Merge]
    types: [completed]
  schedule:
    # Monthly, on the 2nd, after the previous month's sessions have settled.
    - cron: "0 6 2 * *"
  workflow_dispatch:
    inputs:
      job:
        description: "live: score and write the monthly report; merged: freeze and score merged submissions"
        type: choice
        options: [live, merged]
        default: live

permissions:
  contents: read

jobs:
  validate:
    # Pull requests: every submission builds and the baselines reproduce on offline data.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject edits to bot-owned results
        # Publication times, live and ledger records, monthly reports and ledger
        # entries are written only by workflows on main.
        run: |
          if git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" | grep -E '^leaderboard/(publications\.json|live/|ledger/|reports/)|^submissions/[^/]+/ledger/'; then
            echo "::error::these paths are written by CI only"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[test]"
      - name: Validate submissions
        run: rl-pricing bench validate
      - name: Run baselines on the synthetic task
        run: rl-pricing bench run-all --task synthetic --kind baseline --out-root "$RUNNER_TEMP/board"
      - name: Render leaderboard
        run: |
          rl-pricing bench leaderboard --out-root "$RUNNER_TEMP/board" --no-readme > /dev/null
          cat "$RUNNER_TEMP/board/LEADERBOARD.md" >> "$GITHUB_STEP_SUMMARY"

  merged:
    # Go on only if the pull request Auto Merge ran for is merged and changed
    # a submission (CI-written frozen/ and ledger/ files aside).
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          changed=false
          for pr in $(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[] | select(.merged_at != null) | .number'); do
            if gh api --paginate "repos/$REPO/pulls/$pr/files" --jq '.[].filename' \
                | grep -E '^submissions/[^/]+/' | grep -vqE '^submissions/[^/]+/(frozen|ledger)/'; then
              echo "#$pr changed a submission"
              changed=true
            fi
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  freeze:
    # Merged submissions are frozen on today's data for every task with a live
    # track (unless they arrive already frozen), then stamped as published.
    # CI also computes their historical records on those tasks; a record is
    # recomputed only when its submission changed (`run-all --stale`).
    needs: merged
    if: >-
      !cancelled() && (github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && inputs.job == 'merged')
      || needs.merged.outputs.changed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    concurrency:
      group: bench-write
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Cache benchmark data
        uses: actions/cache@v4
        with:
          path: datasets/bench
          key: bench-data-${{ github.run_id }}
          restore-keys: bench-data-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[test]"
      - name: Freeze submissions that have no freeze yet
        run: rl-pricing bench freeze
      - name: Publish new freezes
        run: rl-pricing bench publish
      - name: Historical records for new or changed submissions
        run: rl-pricing bench run-all --stale
      - name: Render leaderboard
        run: rl-pricing bench leaderboard
      - name: Commit frozen policies, publication times and records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add submissions leaderboard README.md
          if git diff --cached --quiet; then
            echo "Nothing to freeze or score"
          else
            git commit -m "bench: freeze and score merged submissions [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  live:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.job != 'merged')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
      actions: read  # ledger verification reads workflow runs
    concurrency:
      group: bench-write
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Cache benchmark data
        uses: actions/cache@v4
        with:
          path: datasets/bench
          key: bench-data-${{ github.run_id }}
          restore-keys: bench-data-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[test]"
      - name: Score frozen policies on new sessions
        run: rl-pricing bench live --refresh
      - name: Score ledger decisions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --refresh: ledger-only tasks (us-aapl, us-googl, us-amzn) are not
        # refreshed by `bench live`, and the restored cache can end a session
        # before the month's last close.
        run: rl-pricing bench ledger score --refresh
      - name: Monthly report
        run: rl-pricing bench monthly
      - name: Render leaderboard and verdicts
        run: |
          rl-pricing bench leaderboard
          rl-pricing bench reports
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leaderboard reports README.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "bench: update live leaderboard [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
